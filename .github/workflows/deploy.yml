name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. No se cancela el que ya está en vuelo: dejar Pages
# a medio publicar es peor que esperar a que termine.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Servimos en github.io/PokeTypes, no en la raíz del dominio.
      # De aquí salen el basePath del bundle y las URLs canónicas del SEO.
      NEXT_PUBLIC_BASE_PATH: /PokeTypes
      NEXT_PUBLIC_SITE_URL: https://javier-nole.github.io/PokeTypes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Puerta antes de publicar: incluye el test de arquitectura que impide
      # que src/lib acabe importando React.
      - run: npm test

      # `npm run build` es tsc --noEmit && next build; con output: 'export'
      # deja el sitio ya montado en ./out.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
